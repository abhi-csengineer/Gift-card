    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#472C42" />
    <meta name="robots" content="index, follow" />
    <script>
      try {
        var s = localStorage.getItem('color-scheme');
        if (s === 'light' || s === 'dark') {
          document.querySelector('meta[name="color-scheme"]').setAttribute('content', s);
        }
      } catch {}
    </script>
